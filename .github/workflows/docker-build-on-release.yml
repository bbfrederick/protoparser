name: Upload release to DockerHub and ECR

on:
  release:
    types: [published]

jobs:
  docker:

    runs-on: ubuntu-latest

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.x'

      - name: Install Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}   # checkout the correct branch name
          fetch-depth: 0

      - name: Determine Version
        id:   gitversion # id to later be referenced
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          additionalArguments: /config commit-date-format="yyyy-MM-ddTHH:mm:ss-0000"

      - name: Alternate Git Version
        id: alternategitversion
        uses: codacy/git-version@2.8.7
        with:
          release-branch: 'main'
          prefix: 'v'

      - name: Direct Git Version
        id: directgitversion
        run: |
          GITDIRECTVERSION=`git describe --tags --dirty`
          echo "GITDIRECTVERSION=${GITDIRECTVERSION}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Determine package version
        env:
          # Interpolated into the environment rather than into the script
          # below: a `${{ }}` expansion is pasted in as text before bash sees
          # it, so a tag containing shell syntax would run as shell.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # .git is excluded from the Docker build context, and "Free disk
          # space" below deletes it outright, so setuptools-scm has nothing to
          # read inside the image and the version has to be handed in.
          #
          # Ask setuptools-scm itself rather than reshaping `git describe`.
          # Its answer is PEP 440 ("0.1.1.dev23+g8c1eba1") and describe's is
          # not ("0.1.0-23-g8c1eba1"), and an invalid version does not fall
          # back to anything: packaging raises InvalidVersion, the build
          # backend aborts, and the image fails to build outright. Asking the
          # same tool the sdist uses is also what keeps the number in the
          # image identical to the one a source install reports.
          python -m pip install --quiet "setuptools-scm>=8"
          VERSION=$(python -m setuptools_scm)
          if [ -z "$VERSION" ]; then
            echo "::error::could not determine a version from the checkout; fetch-depth must be 0 so the tags are present"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version: ${VERSION}"

          # A release image must carry the released number. If these disagree
          # the tag is not one setuptools-scm recognises as a version, and the
          # image would go out to Docker Hub labelled as a dev build.
          TAG="$RELEASE_TAG"
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::release tag ${TAG} and computed version ${VERSION} disagree; the image would be mislabelled"
            exit 1
          fi

      - name: Display GitVersion outputs (step output)
        run: |
          GITSHA=${{ steps.gitversion.outputs.Sha }}
          GITSHA8=${GITSHA:0:8}
          GITCOMMITS=${{ steps.gitversion.outputs.CommitsSinceVersionSource }}
          GITPREVVERSION=${{ steps.alternategitversion.outputs.previous-version }}
          GITVERSION=${GITPREVVERSION}+${GITCOMMITS}.g${GITSHA8}
          GITTIME=`git show | grep Date | head -n 1 | awk '{print $5 $7}'`
          GITDATE=${{ steps.gitversion.outputs.commitDate }}"T"${GITTIME}
          GITPRERELEASE=${{ steps.gitversion.outputs.preReleaseTag }}
          echo "GITVERSION=${GITVERSION}" >> $GITHUB_ENV
          echo "GITSHA=${GITSHA}" >> $GITHUB_ENV
          echo "GITDATE=${GITDATE}" >> $GITHUB_ENV
          echo "GITPRELEASE=${GITPRERELEASE}" >> $GITHUB_ENV
          BUILD_TIME=$(date -Iseconds)
          echo "BUILD_TIME=${BUILD_TIME}" >> $GITHUB_ENV

      - name: What
        run: echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: fredericklab/protoparser

      - name: Free disk space
        run: | 
          df -h
          sudo rm -rf ${GITHUB_WORKSPACE}/.git
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
              ${{ steps.meta.outputs.tags }}
              fredericklab/protoparser:latest-release
          build-args: |
            VERSION=${{ env.VERSION }}
            BRANCH=${{ env.BRANCH }}
            GITVERSION=${{ env.GITVERSION }}
            GITSHA=${{ env.GITSHA }}
            GITDATE=${{ env.GITDATE }}
            GITDIRECTVERSION=${{ env.GITDIRECTVERSION }}
            BUILD_TIME=${{ env.BUILD_TIME }}
            BUILD_DATE=${{ env.BUILD_TIME }}
            VCS_REF=${{ env.GITSHA }}
          labels: ${{ steps.meta.outputs.labels }}
