name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]

    steps:
      # setuptools-scm derives the version from the tag history, and the
      # default shallow clone has neither tags nor depth. Without this every
      # CI build reports 0.1.dev1 and the version tests are meaningless.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The OCR fallback is the one piece that needs a native binary. No
      # example of any release takes that path, so the tests that use it skip
      # cleanly without it -- but installing it here is what keeps the
      # fallback honest on every platform rather than only on a developer's
      # Mac.
      - name: Install tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Install tesseract (Windows)
        if: runner.os == 'Windows'
        run: choco install --no-progress -y tesseract

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # shell: bash matters here. A multi-line run block uses pwsh on Windows,
      # where a native command sets $LASTEXITCODE without halting the script,
      # so only the last line would decide the result and a black failure
      # would be masked by a passing codespell. bash runs with -e everywhere.
      - name: Check formatting
        shell: bash
        run: |
          python -m black --check .
          python -m isort --check-only .
          python -m codespell_lib

      # The OCR tests skip themselves when tesseract is unusable, and a skip
      # reads like a pass in the summary -- so a broken install would go
      # unnoticed on the platform it broke on. Assert both halves instead:
      # the binary must be discoverable here, and the report check after the
      # suite proves those tests actually ran rather than skipping.
      # Windows is the case this exists for: choco writes tesseract to
      # Program Files without putting it on PATH, so a PATH-only lookup fails
      # on a runner that has it installed.
      - name: Tesseract must be discoverable
        shell: bash
        run: |
          python -c "
          import sys
          from siemens_protocol.extract.ocr import find_tesseract
          found = find_tesseract()
          print('discovered:', found)
          if not found:
              print('::error::tesseract was installed but discovery did not find it')
              sys.exit(1)
          "

      # app.js is executed under node:vm against a live server, so node is
      # what makes those tests real -- and they skip themselves without it,
      # which reads like a pass in the summary. Every GitHub-hosted runner
      # ships node (actions/checkout is itself a node action), so a skip here
      # means something else broke and should be loud -- which the report
      # check after the suite asserts, node being no use if the tests that
      # need it skipped anyway. Windows matters most here: the path separator
      # the picker renders differs from the one it was written on.
      - name: Node must be present for the front end
        shell: bash
        run: |
          node --version

      # The .exar1 tests skip wholesale when no archive is discoverable, and
      # a skip reads like a pass -- the same trap the two guards above exist
      # for. It is a live risk here because the corpus is discovered rather
      # than declared: examples/<VERSION>/*.exar1, or SIEMENS_PROTOCOL_EXAR_DIR
      # pointing outside the repo. Losing the shipped archive would silently
      # stop testing the reader, the patcher and the hashing all at once.
      # Discovery is asked of conftest rather than reimplemented as a glob,
      # because a guard that asks a different question than the code does is
      # how the tesseract skip went unnoticed on Windows. The other half --
      # that they then ran -- is the report check after the suite.
      - name: The .exar1 archives must be present
        shell: bash
        env:
          PYTHONPATH: tests
        run: |
          python -c "
          import sys
          from conftest import EXAR_FILES
          for path, version in EXAR_FILES:
              print('discovered:', version, path)
          if not EXAR_FILES:
              print('::error::no .exar1 archive was discovered, so those tests would skip')
              sys.exit(1)
          "

      # Across cores: the suite is twelve minutes serially and five at -n 8.
      # This is the only place the tests run. The three guards above used to
      # each run their own files serially and grep the output for `skipped`,
      # because xdist workers interleave stdout -- which meant the .exar1
      # files, carrying the two corpus sweeps, ran twice per job: 835 s
      # serially in the guard and again here. That was 46% of the job.
      - name: Test
        run: python -m pytest -q -n auto --junit-xml=results.xml

      # The other half of each guard above: a skip reads like a pass, so the
      # suites that skip themselves when something is missing must be shown
      # to have actually run. The report is written by the xdist *controller*
      # and aggregates the workers, so it carries per-test skip status that
      # interleaved stdout cannot -- which is what lets the runs above go.
      # It is also stricter than the greps it replaces: those asked whether
      # a file's output held the word "skipped" anywhere, this names the
      # tests that must have run and counts them.
      - name: The guarded suites must have run, not skipped
        shell: bash
        run: |
          python -c "
          import sys
          import xml.etree.ElementTree as ET

          GUARDS = {
              'OCR': (lambda c, n: c == 'tests.test_pipeline' and n.startswith('test_ocr_'),
                      'tesseract was not usable'),
              'front end': (lambda c, n: c == 'tests.test_frontend',
                            'app.js was never executed'),
              '.exar1': (lambda c, n: c in ('tests.test_exar', 'tests.test_exar_patch'),
                         'the archives were not usable'),
          }
          root = ET.parse('results.xml').getroot()
          suite = root.find('testsuite') if root.tag == 'testsuites' else root
          cases = [(tc.get('classname') or '', tc.get('name') or '',
                    tc.find('skipped') is not None)
                   for tc in suite.iter('testcase')]

          bad = False
          for label, (match, why) in GUARDS.items():
              mine = [(n, sk) for c, n, sk in cases if match(c, n)]
              ran = [n for n, sk in mine if not sk]
              skipped = [n for n, sk in mine if sk]
              print(f'{label}: {len(ran)} ran, {len(skipped)} skipped')
              if not mine:
                  print(f'::error::no {label} tests were collected at all')
                  bad = True
              elif skipped:
                  print(f'::error::{len(skipped)} {label} tests skipped, so {why}: {skipped[:5]}')
                  bad = True
          sys.exit(1 if bad else 0)
          "

      # Proves the human-readable report survives a redirected stream, which
      # on Windows is where the legacy code page bites and a console does not.
      - name: Report to a redirected stream
        shell: bash
        run: spt list examples/XA60/R01_Mindfulness.pdf > report.txt

  wheel:
    name: build a platform-independent wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: The wheel must be pure Python
        run: ls dist/ | grep -- '-py3-none-any\.whl$'
      # The build succeeds either way, so a version that lost its git history
      # would ship silently. A shallow checkout yields "0.1.dev1" with no
      # commit hash; anything derived from real history carries one, or is a
      # clean release number matching the tag.
      - name: The wheel must carry a version derived from git
        run: |
          wheel=$(ls dist/*.whl)
          echo "built: $wheel"
          version=$(basename "$wheel" | cut -d- -f2)
          echo "version: $version"
          described=$(git describe --tags --always --dirty | sed 's/^v//')
          echo "git describes HEAD as: $described"
          case "$version" in
            *+g*) echo "ok: development version carries a commit hash" ;;
            *)
              # No local part, so this must be an exact tag.
              if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
                echo "ok: clean release version on a tagged commit"
              else
                echo "::error::version '$version' has no commit hash and HEAD is not tagged"
                exit 1
              fi
              ;;
          esac
