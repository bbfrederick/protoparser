[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "siemens-protocol"
dynamic = ["version"]
description = "Parse Siemens MR protocol PDF exports into hierarchical JSON"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Pure Python plus PyMuPDF, which publishes wheels for Linux, macOS and
# Windows. The OCR fallback needs a native tesseract binary, so it is an
# extra rather than a dependency: no example of any release has ever taken
# that path, and requiring it would put a non-pip install step in front of
# every user on every platform.
dependencies = [
    "pymupdf>=1.24",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pillow>=9.0"]
test = ["pytest>=7", "pytesseract>=0.3.10", "pillow>=9.0"]
dev = [
    "pytest>=7",
    "pytesseract>=0.3.10",
    "pillow>=9.0",
    "black>=24",
    "isort>=5",
    "codespell>=2.3",
]

# The command, which is deliberately not the distribution name above: the
# package installs as siemens-protocol and is imported as siemens_protocol,
# but the thing you type is siemens-protocol-tool.
[project.scripts]
siemens-protocol-tool = "siemens_protocol.cli:main"
# The GUI is a page served to the browser by a loopback server, so it needs
# no toolkit and no extra dependency -- the same reasoning that keeps OCR out
# of the core requirements. "siemens-protocol-tool gui" launches the same thing.
siemens-protocol-gui = "siemens_protocol.gui:main"

# The version comes from the git tag, so there is no number to keep in step
# anywhere: no literal in this file, none in __init__, none in a VERSION file.
# Between tags setuptools-scm derives a dev version from the distance to the
# last one (0.1.1.dev3+g908a065), which makes an unreleased build obvious on
# sight. The generated module is what lets an installed copy report its
# version with no git checkout present.
[tool.setuptools_scm]
version_file = "src/siemens_protocol/_version.py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siemens_protocol = [
    "vocabulary/*.json",
    "policy/*.json",
    "sequences/*.json",
    "gui/static/*",
    "py.typed",
]

[tool.black]
line-length = 99
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 99
src_paths = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.codespell]
# loadtest/ holds disposable scanner round-trip artifacts, PDFs included;
# paramcheck/ and copyparamexamples/ hold option-scan exports, likewise.
skip = "./examples,./tests/golden,./loadtest,./paramcheck,./copyparamexamples"
# TE and TR are parameter keys, not typos. ADDIN is a literal field of the
# .exar1 baseline string ("MAJORVERSION:VA60A, ADDIN:NXMAINLINE, ..."), which
# is quoted in CLAUDE.md and matched in code. This list is matched
# case-sensitively, so the lowercase spellings need their own entries: the
# exar preview paths write the echo time as "sub.0.msr.te.0", and "TE" alone
# does not cover that -- codespell reads the bare "te" as the/be/we/to.
# NOE is the Nuclear Overhauser Effect, which names one of the spectroscopy
# examples and so appears in the scan-count and sequence tests.
ignore-words-list = "TE,TR,te,tr,ADDIN,NOE"
